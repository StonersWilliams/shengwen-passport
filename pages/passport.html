  <script>
    // 语音合成 - 使用英语TTS拼读国际音标近似音
    const ipaToEnMap = {
      'rma': 'rma',
      'ʂpa': 'shpar',
      'kʰə': 'kuh',
      'tɕi': 'jee',
      'mi': 'mee',
      'ŋu': 'ngoo',
      'bæ': 'bah',
      'ʐu': 'roo',
      'sə': 'suh',
      'ŋa': 'ngah',
      'tʂu': 'joo',
      'le': 'leh'
    };

    // 通用国际音标 → 英语近似拼读（用于 TTS 朗读，非严格转写）
    const IPA_RULES = [
      ['ɖ͡ʐ', 'dr'], ['t͡ɕ', 'j'], ['d͡ʑ', 'j'], ['t͡s', 'ts'], ['d͡z', 'dz'],
      ['tʂ', 'ch'], ['dʐ', 'j'], ['ʈʂ', 'ch'],
      ['ʂ', 'sh'], ['ʐ', 'r'], ['ɕ', 'sh'], ['ʑ', 'zh'], ['ɣ', 'gh'], ['ʁ', 'r'],
      ['χ', 'kh'], ['q', 'k'], ['x', 'kh'], ['ŋ', 'ng'], ['ɴ', 'ng'],
      ['æ', 'a'], ['ɑ', 'ah'], ['ə', 'uh'], ['ɿ', 'zz'], ['ʴ', 'r'], ['ʰ', ''],
      ['˧', ''], ['˥', ''], ['˩', ''], ['˨', ''], ['˦', ''], ['ˀ', '']
    ];
    function ipaToEn(text) {
      if (!text) return '';
      let s = text.toLowerCase();
      IPA_RULES.forEach(function (pair) { s = s.split(pair[0]).join(pair[1]); });
      return s.replace(/[\[\]]/g, '').trim();
    }

    function speakQiang(qiangText) {
      if (!qiangText || !window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const enText = ipaToEnMap[qiangText] || ipaToEn(qiangText) || qiangText;
      const utter = new SpeechSynthesisUtterance(enText);
      utter.lang = 'en-US';
      utter.rate = 0.7;
      utter.pitch = 1.0;
      utter.volume = 1.0;
      const voices = window.speechSynthesis.getVoices();
      const enVoice = voices.find(v => v.lang.startsWith('en'));
      if (enVoice) utter.voice = enVoice;
      window.speechSynthesis.speak(utter);
    }

    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    // 分类标签切换
    document.querySelectorAll('.category-tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
      });
    });

    // 词条卡片选择
    document.querySelectorAll('.word-card:not(.locked)').forEach(card => {
      card.addEventListener('click', function() {
        document.querySelectorAll('.word-card').forEach(c => c.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>

      { id: 3, name: '萝卜寨', words: [{ q: 'ʐme', h: '日麦', m: '羌人' }, { q: 'tsə', h: '泽', m: '水' }, { q: 'mə', h: '未', m: '火' }, { q: 'ɣɖ͡ʐə', h: '格哲', m: '星星' }, { q: 'ɣɖ͡ʐə zda', h: '格哲兹达', m: '银河' }, { q: 'mujy', h: '木依', m: '雨' }, { q: 'ʐʁupu', h: '日古布', m: '山' }, { q: 'xsət͡su̥', h: '赫色粗', m: '河' }] },
      { id: 4, name: '羌族博物馆', words: [{ q: 'ʐme', h: '日麦', m: '羌人' }, { q: 'tsə', h: '泽', m: '水' }, { q: 'mə', h: '未', m: '火' }, { q: 'tʂot͡s', h: '卓兹', m: '桌子' }, { q: 'ʂuap', h: '刷普', m: '火把' }, { q: 'meʂui', h: '么水', m: '墨' }, { q: 'ɕuw', h: '休', m: '龙' }, { q: 'ləɣʐ', h: '勒赫日', m: '书' }] },
      { id: 5, name: '曲谷乡', words: [{ q: 'ʐme', h: '日麦', m: '羌人' }, { q: 'tsə', h: '泽', m: '水' }, { q: 'mə', h: '未', m: '火' }, { q: 'ʂtʂosum', h: '什卓松', m: '长老·老师' }, { q: 'xæʴŋu̥', h: '海尔吾', m: '草' }, { q: 'tsəpɑ', h: '泽巴', m: '冰' }, { q: 'bə', h: '布', m: '虫' }, { q: 'ŋu', h: '俄吾', m: '是·在' }] },
      { id: 6, name: '羌人谷', words: [{ q: 'ʐme', h: '日麦', m: '羌人' }, { q: 'tsə', h: '泽', m: '水' }, { q: 'mə', h: '未', m: '火' }, { q: 'punu', h: '布努', m: '猫' }, { q: 'biʑi', h: '比日', m: '蛇' }, { q: 'biaɣʐ', h: '比亚赫日', m: '蝌蚪' }, { q: 't͡ɕi lapa', h: '基拉巴', m: '熊猫' }, { q: 'tɕi', h: '基', m: '一' }] }
    ];

    const PASSPORT_KEY = 'shengwen-passport-progress-v1';
    const LOCK_SVG = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>';
    const CHECK_SVG = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';

        function readPassportProgress() {
      try {
        const raw = localStorage.getItem(PASSPORT_KEY);
        if (!raw) return { unlocked: [1], done: [], scores: {} };
        const data = JSON.parse(raw);
        if (!data || !Array.isArray(data.unlocked) || !data.unlocked.length) {
          return { unlocked: [1], done: [], scores: {} };
        }
        return { unlocked: data.unlocked, done: data.done || [], scores: data.scores || {} };
      } catch (e) {
        return { unlocked: [1], done: [], scores: {} };
      }
    }

    function renderPassport() {
      const prog = readPassportProgress();
      const cta = document.querySelector('.record-section a');
      if (cta && prog) {
        let nextSid = 1;
        for (let i = 1; i <= 6; i++) { if (prog.done.indexOf(i) < 0) { nextSid = i; break; } }
        cta.setAttribute('href', 'challenge.html?station=' + nextSid);
      }
      const unlockedSet = prog.unlocked;

      // 统计
      const collected = [];
      const seen = {};
      passportStations.forEach(st => {
        if (unlockedSet.indexOf(st.id) < 0) return;
        st.words.forEach(w => {
          if (seen[w.q]) return;
          seen[w.q] = 1;
          collected.push({ w: w, station: st.name, sid: st.id });
        });
      });

      const statWords = document.getElementById('statWords');
      const statStations = document.getElementById('statStations');
      const statScore = document.getElementById('statScore');
      if (statWords) statWords.textContent = collected.length;
      if (statStations) statStations.textContent = unlockedSet.length;

      const scoreVals = Object.keys(prog.scores).map(k => prog.scores[k]).filter(v => typeof v === 'number');
      const avg = scoreVals.length ? Math.round(scoreVals.reduce((a, b) => a + b, 0) / scoreVals.length) : 0;
      if (statScore) statScore.textContent = avg ? avg + '%' : '--';

      // 卡片：按分类过滤渲染，空缺补锁定占位
      window.__collected = collected;
      window.__category = window.__category || '全部';
      renderCategoryTabs(collected);
      renderWordGrid();
    }

    const CAT_BY_MEANING = {
      '羌人': '族称', '汉人': '族称',
      '水': '自然', '火': '自然', '雪': '自然', '天空': '自然', '太阳': '自然', '云': '自然',
      '星星': '自然', '银河': '自然', '雨': '自然', '山': '自然', '河': '自然', '冰': '自然',
      '草': '自然', '花': '自然',
      '咂酒': '饮食', '吃': '饮食',
      '时间': '生活', '交谈': '生活', '桌子': '生活', '火把': '生活', '墨': '生活',
      '书': '生活', '长老·老师': '生活', '是·在': '生活',
      '猫': '动植物', '蛇': '动植物', '蝌蚪': '动植物', '熊猫': '动植物', '虫': '动植物', '龙': '动植物',
      '一': '数字'
    };
    const CAT_ORDER = ['族称', '自然', '生活', '饮食', '动植物', '数字', '其他'];

    function catOf(meaning) {
      return CAT_BY_MEANING[meaning] || '其他';
    }

    function renderCategoryTabs(collected) {
      const nav = document.querySelector('.category-tabs');
      if (!nav) return;
      const counts = {};
      collected.forEach(function (it) {
        const c = catOf(it.w.m);
        counts[c] = (counts[c] || 0) + 1;
      });
      const cats = CAT_ORDER.filter(function (c) { return counts[c]; });
      if (window.__category !== '全部' && cats.indexOf(window.__category) < 0) {
        window.__category = '全部';
      }
      const tabs = ['全部'].concat(cats);
      nav.innerHTML = tabs.map(function (c) {
        const n = c === '全部' ? collected.length : counts[c];
        return '<button class="category-tab' + (window.__category === c ? ' active' : '') +
               '" data-cat="' + c + '">' + c + ' <span class="tab-num">' + n + '</span></button>';
      }).join('');
      nav.querySelectorAll('.category-tab').forEach(function (btn) {
        btn.addEventListener('click', function () {
          window.__category = btn.getAttribute('data-cat');
          renderCategoryTabs(window.__collected);
          renderWordGrid();
        });
      });
    }

    const SOURCE_BY_MEANING = {
      '羌人': 'Rrmea', '水': 'ze', '火': 'me', '汉人': 'Rrvve', '时间': 'shegvar',
      '交谈': 'dhuwu rrggurrggue', '雪': 'bea', '天空': 'mudub', '太阳': 'muyagv',
      '云': 'ssddam', '花': 'laba', '星星': 'hhdhe', '银河': 'hhdhe ssdda', '雨': 'muyiu',
      '山': 'rrvvubu', '河': 'hsezw', '桌子': 'zhoz', '火把': 'shuab', '墨': 'meashui',
      '龙': 'xuw', '书': 'lehhrr', '长老·老师': 'shzhosum', '草': 'haerngw', '冰': 'zeba',
      '虫': 'bbe', '是·在': 'ngu', '猫': 'bunu', '蛇': 'bbixxi', '蝌蚪': 'bbiavvrr',
      '熊猫': 'ji laba'
    };

    function showWordDetail(item) {
      if (!item) return;
      const w = item.w;
      const set = function (id, text) {
        const el = document.getElementById(id);
        if (el) el.textContent = text;
      };
      set('detailPinyin', w.q);
      set('detailPhonetic', '[ ' + w.q + ' ] · 北部羌语 · ' + item.station);
      set('detailHanzi', w.h);
      set('detailMeaning', w.m + '。汉字「' + w.h + '」只记音、不表义。');

      const tags = document.getElementById('detailTags');
      if (tags) {
        tags.innerHTML = '<span class="word-detail-tag">' + catOf(w.m) + '</span>' +
          '<span class="word-detail-tag">' + item.station + '</span>' +
          '<span class="word-detail-tag">北部羌语</span>';
      }

      const src = SOURCE_BY_MEANING[w.m];
      set('detailSource', src
        ? 'Wiktionary · Northern Qiang · ' + src
        : '站内既有记音（暂无公开 IPA 出处）');
      set('detailTip', src
        ? '记音取自可查证的北部羌语词条；点击喇叭播放的是英语 TTS 拼读的近似音，不是母语者录音。'
        : '这个词没有查到公开的北羌语 IPA 资料，记音沿用站点原有版本，可信度较低。');

      const btn = document.getElementById('detailPlay');
      if (btn) btn.setAttribute('onclick', "speakQiang('" + w.q + "')");
    }

    function pickWord(q) {
      const list = window.__collected || [];
      const item = list.filter(function (it) { return it.w.q === q; })[0];
      if (item) showWordDetail(item);
      if (typeof speakQiang === 'function') speakQiang(q);
    }

    function renderWordGrid() {
      const grid = document.getElementById('wordGrid');
      if (!grid) return;
      const collected = window.__collected || [];
      const cat = window.__category || '全部';
      const list = cat === '全部'
        ? collected
        : collected.filter(function (it) { return catOf(it.w.m) === cat; });

      if (!list.length) {
        grid.innerHTML = '<div class="grid-empty">这个分类还没有收集到词条，去「寻声地图」继续探索吧。</div>';
        return;
      }

      const cells = list.map(function (item) {
        return '<div class="word-card collected" onclick="pickWord(\'' + item.w.q + '\')">' +
            '<div class="word-card-collected">' + CHECK_SVG + '</div>' +
            '<div class="word-card-pinyin">' + item.w.q + '</div>' +
            '<div class="word-card-hanzi">' + item.w.h + '</div>' +
            '<span class="word-card-category">' + catOf(item.w.m) + ' · ' + item.station + '</span>' +
            '<div class="word-card-station">' + item.w.m + ' · 点击听音</div>' +
          '</div>';
      });

      if (cat === '全部') {
        const SLOTS = Math.max(6, Math.ceil(list.length / 2) * 2);
        for (let i = cells.length; i < SLOTS; i++) {
          cells.push(
            '<div class="word-card locked">' +
              '<div class="word-card-lock-icon">' + LOCK_SVG + '</div>' +
              '<div class="word-card-pinyin">???</div>' +
              '<div class="word-card-hanzi">未解锁</div>' +
              '<span class="word-card-category">待探索</span>' +
              '<div class="word-card-station">前往地图探索</div>' +
            '</div>'
          );
        }
      }
      grid.innerHTML = cells.join('');
      if (list.length && cat === '全部') showWordDetail(list[0]);
    }

    document.addEventListener('DOMContentLoaded', renderPassport);
    window.addEventListener('pageshow', renderPassport);
    </script>
</body>
